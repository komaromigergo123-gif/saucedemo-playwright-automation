services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - CI=true
      - BASE_URL=${BASE_URL:-https://www.saucedemo.com}
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    ipc: host
    command: npm test

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-local
    privileged: true
    user: root
    environment:
      # Relax Jenkins' default CSP so the self-hosted Playwright HTML report (JS-driven) can render
      - JAVA_OPTS=-Dhudson.model.DirectoryBrowserSupport.CSP="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;"
    ports:
      - '8080:8080'
      - '50000:50000'
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_data:
